<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4a2de0">
<title>Happy birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --ink:#1d1344;
  --pearl:#fcfaff;
  --soft:#4b4272;
  --display:"Anybody","Arial Black",Impact,system-ui,sans-serif;
  --hand:"Gochi Hand","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
/* the four vibes. copy a line to make your own, then add a swatch in the HTML */
.app{--bg:#4a2de0;--bg-lift:#6a50f2;--bg-deep:#3a20c4;--accent:#ff5fb0;--on-accent:#2a0a3a}
.app[data-theme="tangerine"]{--bg:#ff5a1f;--bg-lift:#ff7c4a;--bg-deep:#e8460f;--accent:#2f4bff;--on-accent:#fff}
.app[data-theme="bubblegum"]{--bg:#ff8fd0;--bg-lift:#ffaee0;--bg-deep:#f576c0;--accent:#2b35ff;--on-accent:#fff}
.app[data-theme="mint"]{--bg:#35d9ad;--bg-lift:#66ecc6;--bg-deep:#1fc79b;--accent:#ff5a36;--on-accent:#2a0a00}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#4a2de0;color:var(--ink);font-family:var(--display)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────────────────────── layout ───────────────────────── */
.app{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);background:var(--bg);transition:background-color .35s}

.app.clean{grid-template-columns:minmax(0,1fr)}

.stage{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;place-items:center;
  padding:26px 16px 34px;
  min-height:calc(100vh - 84px);min-height:calc(100svh - 84px);
  --dx:0;--dy:0;--rx:0;--ry:0;--mx:50%;--my:50%;--bx:50%;--by:50%;--hyp:0;
}
@media (min-width:900px){.stage{padding:32px;min-height:100vh;min-height:100svh}}
.clean .stage{min-height:100vh;min-height:100svh}
.stage::after{ /* film grain */
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--grain);background-size:100px;opacity:.22;mix-blend-mode:overlay;
}

/* the type wall behind the card */
.wall{
  position:absolute;inset:-6vh -14vw;z-index:-1;pointer-events:none;
  display:flex;flex-direction:column;justify-content:center;
  font-family:var(--display);font-weight:900;font-stretch:150%;
  font-size:clamp(38px,10.5vh,110px);font-size:clamp(38px,10.5svh,110px);
  line-height:.94;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;user-select:none;
}
.wall p{margin:0;--s:1;color:var(--bg-deep);transform:translateX(calc(var(--dx)*var(--s)*3vw))}
.wall p:nth-child(even){--s:-1;color:transparent;-webkit-text-stroke:2px var(--bg-lift)}
.wall p:nth-child(3n+1){margin-left:-14vw}
.wall p:nth-child(3n+2){margin-left:-38vw}
.wall p:nth-child(3n){margin-left:-4vw}

/* ───────────────────────── the card ───────────────────────── */
.wrap{
  --w:min(88vw,420px);
  position:relative;width:var(--w);aspect-ratio:5/7;
  container-type:inline-size;perspective:900px;touch-action:pan-y;
  animation:arrive .95s cubic-bezier(.2,.85,.25,1) both;
}
@media (min-width:900px){.wrap{--w:min(calc((100vh - 64px)*5/7),460px)}}
@supports (height:100svh){@media (min-width:900px){.wrap{--w:min(calc((100svh - 64px)*5/7),460px)}}}
@keyframes arrive{from{opacity:0;transform:translateY(6vh) rotate(-5deg) scale(.9)}to{opacity:1;transform:none}}

.card{
  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  border-radius:6cqw;will-change:transform;
  transform:rotateX(calc(var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg));
  box-shadow:calc(var(--ry)*-1.3px) calc(var(--rx)*1.3px + 2.8cqw) 5cqw -1cqw rgba(24,6,70,.6);
}
.card::after{ /* bevelled edge */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 .45cqw rgba(255,255,255,.75),inset 0 0 0 .9cqw rgba(255,255,255,.14);
}

/* foil layers */
.card>.foil,.card>.lines,.card>.glitter,.card>.film,.card>.glare,.card>.shade{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.foil{background:linear-gradient(125deg,#ff8ad1 0%,#ffd98a 14%,#a9ffd3 30%,#8fe0ff 46%,#b7a4ff 62%,#ff8ad1 78%,#ffd98a 94%,#a9ffd3 100%) var(--bx) var(--by)/330% 330%}
.lines{
  opacity:.85;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,0) 0 .5cqw,rgba(255,255,255,.55) .5cqw .75cqw);
  -webkit-mask-image:linear-gradient(118deg,transparent 12%,#000 40%,transparent 68%);
  mask-image:linear-gradient(118deg,transparent 12%,#000 40%,transparent 68%);
  -webkit-mask-size:280% 280%;mask-size:280% 280%;
  -webkit-mask-position:var(--bx) var(--by);mask-position:var(--bx) var(--by);
}
.glitter{
  background-image:var(--glitter);background-size:190px 190px;
  background-position:calc(var(--dx)*-22px) calc(var(--dy)*-22px);
  opacity:calc(.4 + var(--hyp)*.6);mix-blend-mode:screen;
}
.film{
  background:linear-gradient(110deg,#ff3d9a,#ffb020,#35e0a1,#2ab8ff,#8a5cff,#ff3d9a) calc(100% - var(--bx)) var(--by)/320% 320%;
  mix-blend-mode:soft-light;opacity:calc(.35 + var(--hyp)*.5);
}
.glare{
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.9) 0,rgba(255,255,255,.3) 22%,rgba(255,255,255,0) 50%);
  mix-blend-mode:overlay;opacity:calc(.55 + var(--hyp)*.45);
}
.shade{
  background:radial-gradient(circle at calc(100% - var(--mx)) calc(100% - var(--my)),rgba(40,10,110,.4),rgba(40,10,110,0) 60%);
  mix-blend-mode:multiply;opacity:calc(var(--hyp)*.8);
}

/* card content */
.panel{
  position:absolute;inset:4.4cqw;isolation:isolate;
  display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;
  padding:3.2cqw 3.5cqw 3cqw;
  border:.5cqw solid var(--ink);border-radius:3.2cqw;
  background:linear-gradient(120deg,#fff3fb 0%,#f1f3ff 22%,#eefff7 44%,#fff8e8 66%,#faf0ff 88%,#fff3fb 100%) var(--bx) var(--by)/260% 260%;
}
.top{display:flex;align-items:center;gap:2cqw;margin-bottom:2.2cqw}
.name{
  flex:1;min-width:0;margin:0;padding-bottom:.5cqw;overflow:hidden;white-space:nowrap;
  font-weight:900;font-stretch:135%;font-size:11.5cqw;line-height:1.05;letter-spacing:-.015em;
}
.seal{
  position:relative;flex:none;width:14.5cqw;aspect-ratio:1;display:grid;place-items:center;
  transform:rotate(9deg);filter:drop-shadow(.6cqw .6cqw 0 var(--ink));
}
.seal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal polygon{fill:var(--accent);stroke:var(--ink);stroke-width:3.4;stroke-linejoin:round}
.seal-t{position:relative;display:grid;justify-items:center;line-height:.88;color:var(--on-accent)}
.seal-t i{font-style:normal;font-weight:800;font-size:3cqw}
.seal-t b{font-weight:900;font-stretch:125%;font-size:6.6cqw;letter-spacing:-.02em}
.seal[data-len="3"] .seal-t b{font-size:4.9cqw}
.seal[data-len="1"] .seal-t b{font-size:7.4cqw}

.art{
  position:relative;display:block;width:100%;aspect-ratio:1/.8;margin:0;padding:0;
  appearance:none;-webkit-appearance:none;cursor:pointer;overflow:hidden;isolation:isolate;
  border:.6cqw solid var(--ink);border-radius:3cqw;background:#d4c9ff;
}
.art::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.55)}
.art:focus-visible{outline:.7cqw solid var(--ink);outline-offset:.5cqw}
.art img{
  position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;
  object-position:center 5%;transform-origin:var(--ox,50%) var(--oy,35%);
  transform:translate(calc(var(--dx)*-1.3cqw),calc(var(--dy)*-1.1cqw)) scale(calc(var(--zoom,1)*1.06));
  rotate: -90deg;
}
.avatar{position:absolute;inset:0;width:100%;height:100%}
.avatar .sil{fill:var(--ink)}
.avatar .hat{fill:var(--accent);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.avatar .pom{fill:#fff;stroke:var(--ink);stroke-width:4}
.avatar .lens{fill:#fff}
.has-photo .avatar{display:none}\n.placeholder-note{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#d4c9ff,#ffd6ea);color:#1d1344;font-size:clamp(14px,3cqw,22px);font-weight:900;letter-spacing:.08em}\n.art img:not([hidden]) + .placeholder-note{display:none}
.pill{
  position:absolute;left:50%;bottom:3.2cqw;z-index:4;transform:translateX(-50%);
  padding:1.5cqw 3.6cqw;border-radius:99px;background:var(--ink);color:#fff;
  font-weight:800;font-size:3.6cqw;line-height:1;white-space:nowrap;transition:opacity .15s;
}
.has-photo .pill{opacity:0}
.has-photo .art:hover .pill,.has-photo .art:focus-visible .pill{opacity:1}
.dragging .art{outline:.8cqw dashed var(--accent);outline-offset:.6cqw}

.ribbon{
  position:relative;z-index:2;justify-self:center;margin-top:-4.6cqw;
  padding:1.9cqw 4.4cqw 2.1cqw;background:var(--accent);color:var(--on-accent);
  border:.55cqw solid var(--ink);border-radius:1.4cqw;box-shadow:1cqw 1cqw 0 var(--ink);
  transform:rotate(-2.4deg);white-space:nowrap;
  font-weight:900;font-stretch:124%;font-size:6cqw;line-height:1;letter-spacing:-.01em;
}
.wish{
  align-self:center;margin:0;padding:2.6cqw 2cqw 0;text-align:center;overflow:hidden;overflow-wrap:anywhere;
  font-family:var(--hand);font-size:4.8cqw;line-height:1.18;text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;
}
.from{
  justify-self:end;max-width:100%;margin:.4cqw 3cqw 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--hand);font-size:5.2cqw;line-height:1.15;transform:rotate(-2deg);
}

/* ───────────────────────── controls ───────────────────────── */
.controls{display:none!important;
  position:relative;z-index:2;display:grid;gap:20px;align-content:start;
  padding:24px 20px 36px;margin-top:-10px;border-radius:28px 28px 0 0;background:var(--pearl);
}
.clean .controls{display:none!important;display:none}
@media (min-width:900px){
  .controls{display:none!important;height:100vh;height:100svh;overflow:auto;margin-top:0;border-radius:0;border-left:2px solid var(--ink);padding:28px 24px 36px}
}
.controls h2{margin:0;font-size:26px;line-height:1;font-weight:900;font-stretch:125%;letter-spacing:-.015em}
.hint{margin:6px 0 0;font-size:14px;line-height:1.4;color:var(--soft)}
.controls>.hint{margin:0}
.field{display:grid;gap:7px}
.field>span,.vibes legend,.rng>span{font-size:14px;font-weight:700;line-height:1.2}
.field>span{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field>span em{font-style:normal;font-weight:500;font-size:13px;color:var(--soft)}
.field input,.field textarea{width:100%;padding:11px 13px;font-size:16px;font-weight:500;line-height:1.3;background:#fff;border:2px solid var(--ink);border-radius:12px}
.field textarea{resize:vertical;min-height:96px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px}

.photo-block{display:grid;gap:12px}
.photo-block .btn{justify-self:start}
.note{margin:0;font-size:13px;line-height:1.4;color:var(--soft)}
.adjust{display:none;gap:12px;padding:14px;border:2px solid var(--ink);border-radius:14px;background:#fff}
.has-photo .adjust{display:grid}
.rng{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px}
.rng input{width:100%;accent-color:var(--accent)}

.btn{
  appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:11px 20px;cursor:pointer;
  font-size:15px;font-weight:800;color:var(--ink);background:#fff;
  border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.link{
  appearance:none;-webkit-appearance:none;justify-self:start;padding:6px 0;background:none;border:0;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;
}
.actions{display:flex;flex-wrap:wrap;gap:12px}

.vibes{margin:0;padding:0;border:0;min-width:0}
.vibes legend{padding:0;margin-bottom:10px}
.vibes .set{display:flex;gap:14px}
.vibes label{position:relative;cursor:pointer}
.vibes input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.vibes .dot{display:block;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%)}
.vibes input:checked+.dot{box-shadow:0 0 0 3px var(--pearl),0 0 0 6px var(--ink)}
.vibes input:focus-visible+.dot{outline:3px solid var(--ink);outline-offset:8px}

/* confetti + toast */
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
.toast{
  position:fixed;left:50%;bottom:22px;z-index:30;transform:translateX(-50%);
  max-width:min(92vw,420px);padding:11px 16px;border-radius:14px;
  background:var(--ink);color:#fff;font-size:14px;line-height:1.35;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);
}

/* clean view: hide the editing chrome */
.clean .pill{display:none}
.clean .art{pointer-events:none;cursor:default}

@media (prefers-reduced-motion:reduce){
  .wrap{animation:none}
  .app,.btn,.pill{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app" data-theme="violet">

  <main class="stage" id="stage">
    <div class="wall" id="wall" aria-hidden="true"></div>

    <div class="wrap" id="wrap">
      <article class="card" id="card" aria-label="Birthday card">
        <div class="foil"></div>
        <div class="lines"></div>
        <div class="glitter"></div>

        <div class="panel">
          <header class="top">
            <h1 class="name" id="nameOut">ANNIYA!</h1>
            <div class="seal" id="seal" data-len="2">
              <svg viewBox="-50 -50 100 100" aria-hidden="true"><polygon id="burst"></polygon></svg>
              <span class="seal-t"><i>Lv</i><b id="ageOut">26</b></span>
            </div>
          </header>

          <div class="art" id="art" aria-label="Photo placeholder">
            <img id="photo" src="Birthday-boy.jpeg" alt="Add your photo here" onerror="this.hidden=true">
          </div>

          <div class="ribbon">Happy birthday!</div>
          <p class="wish" id="wishOut"></p>
          <p class="from" id="fromOut" hidden></p>
        </div>

        <div class="film"></div>
        <div class="glare"></div>
        <div class="shade"></div>
      </article>
    </div>
  </main>

  <aside class="controls" id="controls" aria-label="Card settings">
    <div>
      <h2>Make the card</h2>
      <p class="hint">Everything updates live as you type.</p>
    </div>

    <div class="photo-block">
      <button class="btn primary" id="choose" type="button">Choose photo</button>
      <p class="note" id="note" role="status" aria-live="polite">Or drop or paste an image anywhere on the page.</p>
      <div class="adjust">
        <label class="rng"><span>Zoom</span><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
        <label class="rng"><span>Left / right</span><input id="ox" type="range" min="0" max="100" value="50"></label>
        <label class="rng"><span>Up / down</span><input id="oy" type="range" min="0" max="100" value="35"></label>
        <button class="link" id="remove" type="button">Remove photo</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>

    <div class="row2">
      <label class="field"><span>Name</span><input id="name" type="text" maxlength="22" value="Alex" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>Age</span><input id="age" type="number" inputmode="numeric" min="1" max="120" value="22"></label>
    </div>
    <label class="field"><span>From</span><input id="from" type="text" maxlength="22" value="Sam" placeholder="Your name" autocomplete="off"></label>
    <label class="field"><span>Message <em id="count">0/140</em></span><textarea id="msg" rows="4" maxlength="140">Another lap around the sun and you're still the best person I know. Eat the cake, ignore your phone.</textarea></label>

    <fieldset class="vibes">
      <legend>Vibe</legend>
      <div class="set">
        <label title="Ultraviolet"><input type="radio" name="vibe" value="violet" checked><span class="dot" style="--c1:#4a2de0;--c2:#ff5fb0"></span><span class="sr">Ultraviolet</span></label>
        <label title="Tangerine"><input type="radio" name="vibe" value="tangerine"><span class="dot" style="--c1:#ff5a1f;--c2:#2f4bff"></span><span class="sr">Tangerine</span></label>
        <label title="Bubblegum"><input type="radio" name="vibe" value="bubblegum"><span class="dot" style="--c1:#ff8fd0;--c2:#2b35ff"></span><span class="sr">Bubblegum</span></label>
        <label title="Mint"><input type="radio" name="vibe" value="mint"><span class="dot" style="--c1:#35d9ad;--c2:#ff5a36"></span><span class="sr">Mint</span></label>
      </div>
    </fieldset>

    <div class="actions">
      <button class="btn primary" id="party" type="button">Celebrate</button>
      <button class="btn" id="hide" type="button">Hide controls</button>
    </div>
    <p class="hint">Tap the card for confetti. To share it, hide the controls and take a screenshot.</p>
  </aside>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const wall = document.getElementById('wall');
  const name = document.getElementById('nameOut');
  const age = document.getElementById('ageOut');
  const wish = document.getElementById('wishOut');
  const from = document.getElementById('fromOut');
  const lines = Array.from({length:13}, () => wall.appendChild(document.createElement('p')));
  const recipient = 'Anna';
  lines.forEach(p => p.textContent = ('Happy birthday ' + recipient + ' ✦ ').repeat(4));
  wish.textContent = 'Wishing you the happiest birthday, filled with laughter, love, and unforgettable memories!';
  from.textContent = '— From me';
  from.hidden = false;
  document.title = 'Happy birthday!';
  const seal = document.getElementById('seal');
  const burst = document.getElementById('burst');
  const pts = [];
  for (let i=0;i<36;i++){ const r=i%2?41:49,a=Math.PI*i/18-Math.PI/2; pts.push((Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1)); }
  burst.setAttribute('points',pts.join(' '));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const setMotion = (x,y) => {
    const dx=x*2-1,dy=y*2-1,s=document.getElementById('stage').style;
    s.setProperty('--dx',dx);s.setProperty('--dy',dy);
    s.setProperty('--rx',-dy*7);s.setProperty('--ry',dx*8);
    s.setProperty('--mx',(x*100)+'%');s.setProperty('--my',(y*100)+'%');
    s.setProperty('--bx',(50+dx*35)+'%');s.setProperty('--by',(50+dy*35)+'%');
    s.setProperty('--hyp',Math.min(1,Math.hypot(dx,dy)));
  };
  document.getElementById('wrap').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect();setMotion((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);});
  document.getElementById('wrap').addEventListener('pointerleave',()=>setMotion(.5,.5));
  if(!reduce) setTimeout(()=>setMotion(.65,.35),400);
})();
</script>
</body>
</html>
